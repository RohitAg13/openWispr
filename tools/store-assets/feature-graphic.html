<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenWispr — feature graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Google Play feature graphic — exactly 1024x500, JPEG or 24-bit PNG, no alpha.
     Play crops and overlays this on some surfaces, so everything that matters is
     kept inside the middle ~85% and well clear of the edges. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #666; font-family: 'Mulish', sans-serif; -webkit-font-smoothing: antialiased; }

  .feature {
    position: relative;
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: linear-gradient(138deg, #F2B183 0%, #E07B52 48%, #B85A55 100%);
    display: flex;
    align-items: center;
    padding: 0 72px;
  }
  /* soft light bloom, top-left */
  .feature::before {
    content: '';
    position: absolute;
    top: -220px; left: -140px;
    width: 720px; height: 720px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,229,199,0.55), transparent);
  }
  /* deep vignette, bottom-right */
  .feature::after {
    content: '';
    position: absolute;
    right: -180px; bottom: -260px;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(120,42,50,0.45), transparent);
  }

  .left { position: relative; z-index: 2; }

  .lockup { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
  .lockup .mark { width: 62px; height: 62px; color: #FCF8F4; }
  .lockup .word {
    font-size: 60px;
    font-weight: 800;
    letter-spacing: -0.035em;
    color: #FCF8F4;
    text-shadow: 0 2px 14px rgba(110,40,25,0.28);
  }

  .tag {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: #FFF3E9;
    line-height: 1.24;
  }
  .sub {
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,238,225,0.86);
  }

  /* waveform motif on the right */
  .wave {
    position: relative;
    z-index: 2;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 11px;
    padding-right: 14px;
  }
  .wave span {
    width: 11px;
    border-radius: 7px;
    background: rgba(255,246,238,0.92);
    box-shadow: 0 6px 18px -6px rgba(120,40,25,0.5);
  }
</style>
</head>
<body>
  <div class="feature" id="fg">
    <div class="left">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 100 100" style="fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;">
          <path d="M67,29 A25,25 0 1 0 67,71"/>
          <path d="M69,50 C75,44 79,56 86,49"/>
        </svg>
        <div class="word">OpenWispr</div>
      </div>
      <div class="tag">Offline voice typing.<br>Private by default.</div>
      <div class="sub">Free · open source · no account</div>
    </div>

    <div class="wave">
      <span style="height:44px;"></span>
      <span style="height:96px;"></span>
      <span style="height:168px;"></span>
      <span style="height:246px;"></span>
      <span style="height:150px;"></span>
      <span style="height:82px;"></span>
      <span style="height:196px;"></span>
      <span style="height:120px;"></span>
      <span style="height:58px;"></span>
    </div>
  </div>
</body>
</html>
